<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Products — Squishy Society admin</title>
<link rel="stylesheet" href="admin.css">
<style>
  /* Bulk-edit bar. Sticks to the top of the list so it stays reachable
     when you've scrolled a long way down a selection. */
  .bulkbar {
    position: sticky; top: 0; z-index: 5;
    display: none; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 0 0 12px; padding: 10px 14px;
    background: #fff6fa; border: 1px solid #f0cfe0; border-radius: 12px;
  }
  .bulkbar.on { display: flex; }
  .bulkbar .n { font-weight: 600; }
  .bulkbar .spacer { flex: 1; }
  .selcol { width: 34px; text-align: center; }
  .selcol input { width: auto; margin: 0; cursor: pointer; }
  tr.sel td { background: #fff8fb; }

  /* Click-to-edit numbers. The dotted underline is the affordance —
     without it nobody discovers the cell is editable. */
  .editable { cursor: text; border-bottom: 1px dashed #d9b8ca; }
  .editable:hover { background: #fff2f8; }
  .cell-input {
    width: 88px; padding: 2px 6px; margin: 0;
    text-align: right; font: inherit;
    border: 1px solid #e05a9b; border-radius: 6px; background: #fff;
  }
  td.saving { opacity: .5; }
  .locked { color: #a2939d; cursor: default; }
</style>
</head>
<body>

<div id="admin-shell"></div>

<div class="admin-container">
  <div class="page-head">
    <div>
      <h1>Products</h1>
      <p id="count">Loading…</p>
    </div>
    <div style="display:flex; gap:8px;">
      <a class="btn-ghost" href="import.html">Add from URL</a>
      <a class="btn" href="product.html?new=1">New product</a>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="q" placeholder="Search name, SKU or supplier…">
    <select id="status-filter">
      <option value="">All statuses</option>
      <option value="active">Active</option>
      <option value="draft">Draft</option>
      <option value="hidden">Hidden</option>
      <option value="out_of_stock">Out of stock</option>
      <option value="research">Research</option>
      <option value="archived">Archived</option>
    </select>
    <select id="category-filter">
      <option value="">All categories</option>
    </select>
    <button class="btn-ghost btn-sm" id="clear" type="button">Clear</button>
  </div>

  <div class="bulkbar" id="bulkbar">
    <span class="n" id="sel-count">0 selected</span>
    <label for="bulk-status" style="margin:0;">Change status to</label>
    <select id="bulk-status" style="max-width:180px;">
      <option value="">Choose…</option>
      <option value="active">Active</option>
      <option value="draft">Draft</option>
      <option value="hidden">Hidden</option>
      <option value="out_of_stock">Out of stock</option>
      <option value="research">Research</option>
      <option value="archived">Archived</option>
    </select>
    <button class="btn btn-sm" id="apply" type="button" disabled>Apply</button>
    <span class="spacer"></span>
    <button class="btn-ghost btn-sm" id="unselect" type="button">Clear selection</button>
  </div>

  <p class="hint" style="margin:0 0 10px;">
    Click any <strong>Price</strong> or <strong>Cost</strong> to change it — Enter saves, Escape cancels.
    Profit and margin update as you type.
  </p>

  <div id="list"><div class="loading">Loading…</div></div>
</div>

<script src="config.js"></script>
<script type="module">
import {
  supabase, requireAuth, renderShell, money, pct, profitOf, statusPill, esc,
  STATUS_LABELS, toast, friendlyError
} from "./admin.js";

const user = await requireAuth();
renderShell("products.html", user);

const qEl = document.getElementById("q");
const statusEl = document.getElementById("status-filter");
const catEl = document.getElementById("category-filter");

const bulkBar   = document.getElementById("bulkbar");
const bulkSel   = document.getElementById("bulk-status");
const applyBtn  = document.getElementById("apply");
const selCount  = document.getElementById("sel-count");

/* Selected product ids. Kept outside render() so ticks survive a
   re-render — filtering or searching doesn't lose your selection. */
const selected = new Set();

// Prefill filters from the URL so dashboard links land pre-filtered.
const params = new URLSearchParams(location.search);
if (params.get("status")) statusEl.value = params.get("status");
const wantCategory = params.get("category") || "";

const [{ data: products, error }, { data: variants }] = await Promise.all([
  supabase.from("products").select("*").order("sort_order", { ascending: true }),
  supabase.from("product_variants").select("*")
]);

if (error) {
  document.getElementById("list").innerHTML =
    `<div class="note-box">Couldn't load products: ${esc(error.message)}</div>`;
  throw error;
}

// Populate category filter from actual data.
const categories = [...new Set(products.map(p => p.category).filter(Boolean))].sort();
catEl.innerHTML = `<option value="">All categories</option>` +
  categories.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
if (wantCategory) catEl.value = wantCategory;

function variantsFor(id) {
  return (variants || []).filter(v => v.product_id === id)
    .sort((a, b) => a.sort_order - b.sort_order);
}

/**
 * A variant-priced product advertises its cheapest option, so that's
 * the figure shown here — matching what a customer sees as "From $X".
 */
function headline(p) {
  const vs = variantsFor(p.id);
  if (vs.length) {
    const cheapest = vs.reduce((a, b) => (Number(a.price) <= Number(b.price) ? a : b));
    return {
      price: Number(cheapest.price),
      cost: Number(cheapest.variant_cost || 0),
      from: vs.length > 1
    };
  }
  return { price: Number(p.price), cost: Number(p.supplier_cost || 0), from: false };
}

function marginClass(m) {
  if (m >= 0.5) return "margin-good";
  if (m >= 0.35) return "margin-ok";
  return "margin-bad";
}

/** Rows currently passing the filters — what "select all" applies to. */
function visibleRows() {
  const q = qEl.value.trim().toLowerCase();
  const status = statusEl.value;
  const cat = catEl.value;

  return products.filter(p => {
    if (status && p.status !== status) return false;
    if (cat && p.category !== cat) return false;
    if (q) {
      const hay = [p.name, p.sku, p.supplier_name, p.category]
        .filter(Boolean).join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function syncBulkBar() {
  const n = selected.size;
  selCount.textContent = `${n} selected`;
  bulkBar.classList.toggle("on", n > 0);
  applyBtn.disabled = n === 0 || !bulkSel.value;
}

function render() {
  const rows = visibleRows();

  document.getElementById("count").textContent =
    `${rows.length} of ${products.length} product${products.length === 1 ? "" : "s"}`;

  if (!rows.length) {
    document.getElementById("list").innerHTML =
      `<div class="table-wrap"><div class="empty">No products match those filters.</div></div>`;
    syncBulkBar();
    return;
  }

  const allTicked = rows.every(p => selected.has(p.id));

  document.getElementById("list").innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="selcol">
              <input type="checkbox" id="sel-all" ${allTicked ? "checked" : ""}
                     title="Select everything shown">
            </th>
            <th>Product</th>
            <th>Category</th>
            <th>Status</th>
            <th class="num">Price</th>
            <th class="num">Cost</th>
            <th class="num">Profit</th>
            <th class="num">Margin</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(p => {
            const h = headline(p);
            const { cost, profit, margin } = profitOf(h.price, h.cost, p.shipping_cost);
            const vs = variantsFor(p.id);
            const on = selected.has(p.id);
            return `
            <tr class="${on ? "sel" : ""}">
              <td class="selcol">
                <input type="checkbox" class="rowsel" data-id="${esc(p.id)}" ${on ? "checked" : ""}>
              </td>
              <td>
                <div class="prod-cell">
                  <img src="${esc(p.image || "")}" alt="" loading="lazy"
                       onerror="this.style.visibility='hidden'">
                  <div>
                    <div class="nm">${esc(p.name)}</div>
                    <div class="sk">${esc(p.sku)}${vs.length ? ` · ${vs.length} variants` : ""}</div>
                  </div>
                </div>
              </td>
              <td style="text-transform:capitalize;">${esc(p.category || "—")}</td>
              <td>${statusPill(p.status)}</td>
              <td class="num">${
                vs.length
                  ? `<span class="locked" title="Priced per variant — open Edit to change">from ${money(h.price)}</span>`
                  : `<span class="editable" data-id="${esc(p.id)}" data-field="price">${money(h.price)}</span>`
              }</td>
              <td class="num">${
                vs.length
                  ? `<span class="locked" title="Costed per variant — open Edit to change">${money(cost)}</span>`
                  : `<span class="editable" data-id="${esc(p.id)}" data-field="supplier_cost">${money(Number(p.supplier_cost || 0))}</span>` +
                    (Number(p.shipping_cost) > 0
                      ? `<span class="hint" style="margin-left:4px;" title="Shipping, included in profit and margin">+${money(Number(p.shipping_cost))}</span>`
                      : "")
              }</td>
              <td class="num cell-profit">${money(profit)}</td>
              <td class="num cell-margin ${marginClass(margin)}">${h.price > 0 ? pct(margin) : "—"}</td>
              <td class="num">
                <a class="btn-ghost btn-sm" href="product.html?id=${encodeURIComponent(p.id)}">Edit</a>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById("sel-all").addEventListener("change", e => {
    rows.forEach(p => e.target.checked ? selected.add(p.id) : selected.delete(p.id));
    render();
  });

  document.querySelectorAll(".rowsel").forEach(cb => {
    cb.addEventListener("change", () => {
      cb.checked ? selected.add(cb.dataset.id) : selected.delete(cb.dataset.id);
      cb.closest("tr").classList.toggle("sel", cb.checked);
      // Re-render only the header tick, so the page doesn't jump under you.
      const all = visibleRows().every(p => selected.has(p.id));
      document.getElementById("sel-all").checked = all;
      syncBulkBar();
    });
  });

  wireInlineEdit();
  syncBulkBar();
}

/* ---------- click-to-edit price and cost ----------
   Editing in place rather than opening the product page, because
   repricing is something you do across many rows at once. Only
   single-price products are editable here; anything with variants
   has to be changed on its own page, where each variant is visible. */

function rowOf(el) { return el.closest("tr"); }

/** Recomputes the profit and margin cells for one row, without a re-render. */
function refreshDerived(tr, p) {
  const h = headline(p);
  const { profit, margin } = profitOf(h.price, h.cost, p.shipping_cost);
  const profitEl = tr.querySelector(".cell-profit");
  const marginEl = tr.querySelector(".cell-margin");
  if (profitEl) profitEl.textContent = money(profit);
  if (marginEl) {
    marginEl.textContent = h.price > 0 ? pct(margin) : "—";
    marginEl.className = "num cell-margin " + marginClass(margin);
  }
}

function wireInlineEdit() {
  document.querySelectorAll(".editable").forEach(span => {
    span.addEventListener("click", () => {
      if (span.querySelector("input")) return;          // already editing

      const p = products.find(x => x.id === span.dataset.id);
      if (!p) return;
      const field = span.dataset.field;
      const original = Number(p[field] || 0);
      const tr = rowOf(span);

      const input = document.createElement("input");
      input.type = "number";
      input.step = "0.01";
      input.min = "0";
      input.className = "cell-input";
      input.value = original.toFixed(2);

      const restore = value => {
        span.textContent = money(Number(value));
      };

      span.textContent = "";
      span.appendChild(input);
      input.focus();
      input.select();

      // Live feedback while typing — you can see the margin move.
      input.addEventListener("input", () => {
        const preview = { ...p, [field]: Number(input.value || 0) };
        refreshDerived(tr, preview);
      });

      let done = false;

      const cancel = () => {
        if (done) return;
        done = true;
        restore(original);
        refreshDerived(tr, p);
      };

      const commit = async () => {
        if (done) return;
        const next = Number(input.value);

        if (!isFinite(next) || next < 0) {
          toast("That needs to be a number, zero or more.", "err");
          cancel();
          return;
        }
        if (field === "price" && next === 0 && p.status === "active") {
          toast("A live product can't be priced at zero. Set it to Draft first.", "err");
          cancel();
          return;
        }
        if (next === original) { cancel(); return; }

        done = true;
        const cell = span.closest("td");
        cell.classList.add("saving");
        restore(next);

        const { error } = await supabase.from("products")
          .update({ [field]: next }).eq("id", p.id);

        cell.classList.remove("saving");

        if (error) {
          toast(friendlyError(error), "err");
          restore(original);
          refreshDerived(tr, p);
          return;
        }

        p[field] = next;                    // keep the local copy in step
        refreshDerived(tr, p);

        const { margin } = profitOf(headline(p).price, headline(p).cost, p.shipping_cost);
        let msg = `${p.sku} ${field === "price" ? "price" : "cost"} set to ${money(next)}.`;
        if (margin < 0)      msg += " That's a LOSS on every sale.";
        else if (margin < 0.35) msg += ` Margin is now only ${pct(margin)}.`;
        toast(msg, margin < 0.35 ? "err" : "ok");
      };

      input.addEventListener("keydown", e => {
        if (e.key === "Enter")  { e.preventDefault(); commit(); }
        if (e.key === "Escape") { e.preventDefault(); cancel(); }
      });
      input.addEventListener("blur", commit);
    });
  });
}

/**
 * A product with no image or no price renders as a broken card on the
 * shop, so it's held back rather than published. Everything else in the
 * selection still goes through, and the skipped ones are named.
 */
function blocksGoingLive(p) {
  const h = headline(p);
  if (!p.image) return "no photo";
  if (!(h.price > 0)) return "no price";
  return null;
}

applyBtn.addEventListener("click", async () => {
  const target = bulkSel.value;
  if (!target || !selected.size) return;

  const chosen = products.filter(p => selected.has(p.id));
  let toChange = chosen;
  let skipped = [];

  if (target === "active") {
    skipped  = chosen.filter(p => blocksGoingLive(p));
    toChange = chosen.filter(p => !blocksGoingLive(p));
  }

  if (!toChange.length) {
    toast(`Nothing published — ${skipped.map(p => `${p.sku} has ${blocksGoingLive(p)}`).join(", ")}.`, "err");
    return;
  }

  applyBtn.disabled = true;
  applyBtn.textContent = "Applying…";

  const { error } = await supabase.from("products")
    .update({ status: target })
    .in("id", toChange.map(p => p.id));

  applyBtn.textContent = "Apply";

  if (error) {
    toast(friendlyError(error), "err");
    syncBulkBar();
    return;
  }

  // Keep the local copy in step so the table updates without a reload.
  toChange.forEach(p => { p.status = target; });
  selected.clear();
  bulkSel.value = "";

  const label = STATUS_LABELS[target] || target;
  let msg = `${toChange.length} product${toChange.length === 1 ? "" : "s"} set to ${label}.`;
  if (target === "active") msg += " Live on the shop now.";
  if (skipped.length) {
    msg += ` Held back: ${skipped.map(p => `${p.sku} (${blocksGoingLive(p)})`).join(", ")}.`;
  }
  toast(msg, skipped.length ? "err" : "ok");

  render();
});

bulkSel.addEventListener("change", syncBulkBar);
document.getElementById("unselect").addEventListener("click", () => {
  selected.clear();
  bulkSel.value = "";
  render();
});

qEl.addEventListener("input", render);
statusEl.addEventListener("change", render);
catEl.addEventListener("change", render);
document.getElementById("clear").addEventListener("click", () => {
  qEl.value = ""; statusEl.value = ""; catEl.value = "";
  render();
});

render();
</script>

</body>
</html>
