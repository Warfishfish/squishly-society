<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Squishy Society admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="login-wrap">
  <form class="login-card" id="login-form" novalidate>
    <h1>Squishy Society</h1>
    <p class="sub">Shop admin</p>

    <div class="form-error" id="err"></div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required autofocus>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>

    <button class="btn" type="submit" id="submit" style="width:100%; margin-top:6px;">
      Sign in
    </button>
  </form>
</div>

<script src="config.js"></script>
<script type="module">
import { supabase, friendlyError } from "./admin.js";

const form = document.getElementById("login-form");
const errEl = document.getElementById("err");
const btn = document.getElementById("submit");

// Where to land after signing in. Only ever a local admin filename,
// never a full URL — so a crafted ?next= can't bounce someone
// off-site after login.
function safeNext() {
  const raw = new URLSearchParams(location.search).get("next") || "index.html";
  return /^[a-z0-9_-]+\.html$/i.test(raw) ? raw : "index.html";
}

// Already signed in? Skip the form.
const { data } = await supabase.auth.getSession();
if (data.session) location.replace(safeNext());

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errEl.textContent = "";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    errEl.textContent = "Enter your email and password.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Signing in…";

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    errEl.textContent = friendlyError(error);
    btn.disabled = false;
    btn.textContent = "Sign in";
    return;
  }

  location.replace(safeNext());
});
</script>

</body>
</html>
